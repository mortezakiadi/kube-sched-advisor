apiVersion: v1
kind: Service
metadata:
  name: train-b200
  namespace: research
spec:
  clusterIP: None
  selector:
    job-name: train-b200
  ports:
  - name: rendezvous
    port: 29500
---
apiVersion: batch/v1
kind: Job
metadata:
  name: train-b200
  namespace: research
  labels:
    team: research
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimitPerIndex: 0
  maxFailedIndexes: 0
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
        status: 'True'
  template:
    metadata:
      labels:
        app: train-b200
        scheduling.x-k8s.io/pod-group: train-b200
    spec:
      priorityClassName: research-normal
      containers:
      - name: main
        image: ghcr.io/example/trainer:latest
        resources:
          requests:
            cpu: '96'
            memory: 800Gi
            nvidia.com/gpu: 8
          limits:
            memory: 800Gi
            nvidia.com/gpu: 8
        env:
        - name: WORLD_SIZE
          value: '2'
        - name: MASTER_ADDR
          value: train-b200-0.train-b200
        - name: MASTER_PORT
          value: '29500'
        ports:
        - containerPort: 29500
          name: rendezvous
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      schedulerName: gang-scheduler
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      restartPolicy: Never
      subdomain: train-b200
