apiVersion: v1
kind: Service
metadata:
  name: gang-train
  namespace: research
spec:
  clusterIP: None
  selector:
    job-name: gang-train
  ports:
  - name: rendezvous
    port: 29500
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gang-train
  namespace: research
  labels:
    team: research
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 3
  backoffLimitPerIndex: 0
  maxFailedIndexes: 0
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
        status: 'True'
  template:
    metadata:
      labels:
        app: gang-train
        scheduling.x-k8s.io/pod-group: gang-train
    spec:
      priorityClassName: research-normal
      containers:
      - name: main
        image: nvidia/cuda:12.4.1-base-ubuntu22.04
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
            nvidia.com/gpu: 1
          limits:
            memory: 1Gi
            nvidia.com/gpu: 1
        command:
        - nvidia-smi
        - -L
        env:
        - name: WORLD_SIZE
          value: '3'
        - name: MASTER_ADDR
          value: gang-train-0.gang-train
        - name: MASTER_PORT
          value: '29500'
        ports:
        - containerPort: 29500
          name: rendezvous
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-A10G
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      schedulerName: gang-scheduler
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      restartPolicy: Never
      subdomain: gang-train
