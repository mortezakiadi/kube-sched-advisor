apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-t4
  namespace: research
  labels:
    team: research
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: llm-t4
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: *id001
    spec:
      priorityClassName: research-normal
      containers:
      - name: main
        image: nvidia/cuda:12.4.1-base-ubuntu22.04
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
            nvidia.com/gpu: 4
          limits:
            memory: 1Gi
            nvidia.com/gpu: 4
        command:
        - sleep
        - infinity
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      nodeSelector:
        nvidia.com/gpu.product: Tesla-T4
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id001
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id001
