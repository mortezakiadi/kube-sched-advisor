# Throwaway EKS cluster for the recorded demo: three small CPU nodes (setup.sh makes
# them advertise 8 stand-in GPUs each) plus two real g5.xlarge GPU nodes.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: ksa-demo
  region: us-east-2
  tags:
    purpose: kube-sched-advisor-demo
    temporary: "true"
managedNodeGroups:
  - name: demo
    instanceType: t3.medium
    desiredCapacity: 3
    minSize: 3
    maxSize: 3
    volumeSize: 20
  # Two real NVIDIA A10G GPU nodes (1 GPU each). The three t3.medium nodes above carry
  # stand-in H100 capacity; these two carry real GPUs.
  - name: real-gpu
    instanceType: g5.xlarge
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 60
    labels:
      ksa/real-gpu: "true"
