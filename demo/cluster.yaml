# Throwaway EKS cluster for the recorded demo. Every GPU in it is real:
#   4 x g5.xlarge  1 NVIDIA A10G on each node
# plus three small CPU nodes for system pods, Kueue and the second scheduler.
# (A 4-GPU g5.12xlarge node was tried first and AWS had no capacity for it in any zone of
# us-east-2 at the time of recording.)
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: ksa-demo
  region: us-east-2
  tags:
    purpose: kube-sched-advisor-demo
    temporary: "true"
managedNodeGroups:
  - name: demo
    instanceType: t3.medium
    desiredCapacity: 3
    minSize: 3
    maxSize: 3
    volumeSize: 20
  - name: real-gpu
    instanceType: g5.xlarge
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 60
    labels:
      ksa/real-gpu: "true"
  - name: real-gpu-b
    instanceType: g5.xlarge
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 60
    labels:
      ksa/real-gpu: "true"
