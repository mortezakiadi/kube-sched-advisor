# Throwaway EKS cluster for the recorded demo. It has two kinds of GPU node, and the demo
# labels them so nobody has to guess which is which (label ksa/gpu-kind):
#
#   real      4 x g5.xlarge, one real NVIDIA A10G each
#   stand-in  3 x t3.medium CPU nodes. setup.sh makes each advertise 8 nvidia.com/gpu so the
#             demo can show 8-GPU, multi-node and network-block scheduling. They have no GPUs
#             and run nothing but system pods and no-op containers.
#
# (A real 4-GPU g5.12xlarge node was tried and AWS had no capacity for it in any zone of
# us-east-2 at the time of recording; larger real GPU counts need a quota increase.)
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: ksa-demo
  region: us-east-2
  tags:
    purpose: kube-sched-advisor-demo
    temporary: "true"
managedNodeGroups:
  - name: demo
    instanceType: t3.medium
    desiredCapacity: 3
    minSize: 3
    maxSize: 3
    volumeSize: 20
  - name: real-gpu
    instanceType: g5.xlarge
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 60
    labels:
      ksa/real-gpu: "true"
  - name: real-gpu-b
    instanceType: g5.xlarge
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 60
    labels:
      ksa/real-gpu: "true"
