# One pod that wants a whole 8-GPU node, scheduled by the default kube-scheduler.
# Used to compare the advisor's prediction with what the real scheduler says.
apiVersion: v1
kind: Pod
metadata:
  name: train-probe
spec:
  containers:
  - name: train
    image: registry.k8s.io/pause:3.10
    resources:
      requests: {cpu: 10m, memory: 8Mi, nvidia.com/gpu: "8"}
      limits: {nvidia.com/gpu: "8"}
