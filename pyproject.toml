[project]
name = "kube-sched-advisor"
version = "0.1.0"
description = "Plain-English AI/ML workload asks -> Kubernetes scheduling plans, grounded in live cluster state"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["pyyaml>=6"]
[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest"]
[project.scripts]
sched-advisor = "sched_advisor.__main__:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["sched_advisor"]
