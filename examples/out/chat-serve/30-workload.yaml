apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-serve
  namespace: research
  labels:
    team: research
spec:
  replicas: 3
  selector:
    matchLabels: &id001
      app: chat-serve
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: *id001
    spec:
      priorityClassName: research-critical
      containers:
      - name: main
        image: ghcr.io/example/trainer:latest
        resources:
          requests:
            cpu: '12'
            memory: 100Gi
            nvidia.com/gpu: 1
          limits:
            memory: 100Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels: *id001
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id001
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chat-serve
  namespace: research
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: chat-serve
