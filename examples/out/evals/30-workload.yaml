apiVersion: batch/v1
kind: Job
metadata:
  name: evals
  namespace: research
  labels:
    team: research
spec:
  completionMode: Indexed
  completions: 20
  parallelism: 20
  backoffLimitPerIndex: 2
  maxFailedIndexes: 2
  template:
    metadata:
      labels:
        app: evals
    spec:
      priorityClassName: research-low
      containers:
      - name: main
        image: ghcr.io/example/trainer:latest
        resources:
          requests:
            cpu: '12'
            memory: 100Gi
            nvidia.com/gpu: 1
          limits:
            memory: 100Gi
            nvidia.com/gpu: 1
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      tolerations:
      - key: karpenter.sh/capacity-type-spot
        operator: Exists
        effect: NoSchedule
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      schedulerName: gpu-binpack
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      restartPolicy: Never
      subdomain: evals
